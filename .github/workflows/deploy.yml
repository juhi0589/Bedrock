name: Build & Deploy Bedrock

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    parallel: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Composer install (Bedrock core)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build Sage assets (npm install/build)
        working-directory: web/app/themes/sage
        run: |
          npm install
          npm run build

      - name: Archive build for deployment
        run: tar -czf site.tar.gz web

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site

      - name: Deploy to VM via SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PATH: ${{ secrets.VM_PATH }}
          VM_KEY: ${{ secrets.VM_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${VM_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no site.tar.gz $VM_USER@$VM_HOST:/tmp/site.tar.gz
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $VM_USER@$VM_HOST "
            mkdir -p $VM_PATH/current
            tar -xzf /tmp/site.tar.gz -C $VM_PATH/current --strip-components=1
            rm /tmp/site.tar.gz
          "

      - name: Health check
        run: curl -f ${{ secrets.APP_URL }}${{ secrets.HEALTH_PATH }}
